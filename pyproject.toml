[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-writeback-toolkit"
version = "0.1.0"
description = "Evidence-controlled write-back gate for sparse-observation 3D Gaussian representations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]

